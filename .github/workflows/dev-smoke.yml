name: dev-smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Run Ruff check
        run: |
          ruff check backend/app backend/tests scripts
          
      - name: Run Pytest
        run: |
          pytest backend/tests
          
      - name: Check dev environment
        run: |
          python scripts/check_dev_env.py
          
      - name: Verify doc links
        run: |
          python scripts/verify_doc_links.py
          
      - name: Note on smoke_web.py
        run: |
          echo "smoke_web.py is local only and requires the brain running on port 8787. Skipping in CI."
