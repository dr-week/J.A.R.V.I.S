name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: |
          ruff check backend/app backend/tests scripts

      - name: Run Pytest Suite (190+ Tests)
        run: |
          pytest backend/tests/ -v

      - name: Verify Environment & Doc Links
        run: |
          python scripts/check_dev_env.py
          python scripts/verify_doc_links.py

  web-client:
    name: Web Client Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Production Bundle (TypeScript + Vite)
        run: npm run build
