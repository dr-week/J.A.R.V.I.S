name: jarvis_presence
description: Jarvis phone-first presence client — portrait default, adaptive landscape.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  http: ^1.2.0
  logging: ^1.3.0
  provider: ^6.1.5
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
